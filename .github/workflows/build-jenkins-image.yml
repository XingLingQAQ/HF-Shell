name: Build Jenkins Space image

# Builds the Jenkins Space container and publishes it to GHCR, so the Hugging
# Face Space can pull a ready image instead of compiling and downloading its
# runtime on every start.
on:
  push:
    branches: [main]
    paths:
      - "Jenkins/**"
      - ".github/workflows/build-jenkins-image.yml"
  workflow_dispatch:
    inputs:
      jenkins_version:
        description: "Pin a Jenkins LTS core version (e.g. 2.492.1). Empty = track latest stable."
        required: false
        type: string
      no_cache:
        description: "Ignore the layer cache and rebuild from scratch."
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: build-jenkins-image
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hf-jenkins

jobs:
  build:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=jenkins-${{ inputs.jenkins_version }},enable=${{ inputs.jenkins_version != '' }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=HF Jenkins Space
            org.opencontainers.image.description=Jenkins + panel runtime for the Hugging Face Docker Space

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Jenkins
          file: Jenkins/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: ${{ inputs.no_cache == true }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            JENKINS_VERSION=${{ inputs.jenkins_version }}

      - name: Summarise
        run: |
          {
            echo "### Jenkins Space image published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Pull it in the Space \`README.md\` as:"
            echo
            echo '```yaml'
            echo "docker_image: ghcr.io/${{ env.IMAGE_NAME }}:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: Keep Hugging Face Spaces Active

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "Space URL list, separated by commas or newlines. Overrides the repository variable for this run."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: huggingface-keepalive
  cancel-in-progress: false

env:
  DEFAULT_URLS: "https://xinglingqaq-gitea.hf.space/,https://xinglingqaq-jenkins.hf.space/,https://xinglingqaq-uptime.hf.space/,https://xinglingqaq-agent-1.hf.space/,https://mo-cheng-ja-1.hf.space/,https://mo-cheng-ja-2.hf.space/,https://mo-cheng-ja-3.hf.space/,https://xinglingqaq-komari.hf.space/,https://xinglingqaq-qqbot.hf.space/,https://xinglingqaq-reposilite.hf.space/,https://xinglingqaq-xv.hf.space/"
  REPOSITORY_URLS: ${{ vars.HF_KEEPALIVE_URLS }}
  MANUAL_URLS: ${{ inputs.urls }}

jobs:
  visit-spaces:
    name: Visit configured Spaces in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out workflow files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser automation runtime
        run: npm install --no-save playwright-core

      - name: Visit each configured Space in a visible Chromium window
        shell: bash
        run: |
          set -euo pipefail
          urls="${MANUAL_URLS:-${REPOSITORY_URLS:-$DEFAULT_URLS}}"
          browser_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export SPACE_URLS="$urls"
          export BROWSER_EXECUTABLE_PATH="$browser_path"
          "$browser_path" --version
          xvfb-run --auto-servernum node .github/scripts/visit-spaces.mjs

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: space-visit-artifacts
          path: space-visit-artifacts/
          if-no-files-found: ignore
          retention-days: 7

name: Keep Hugging Face Spaces Active

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      urls:
        description: "Space URL list, separated by commas or newlines. Overrides the repository variable for this run."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: huggingface-keepalive
  cancel-in-progress: false

env:
  DEFAULT_URLS: "https://xinglingqaq-gitea.hf.space/,https://xinglingqaq-jenkins.hf.space/"
  REPOSITORY_URLS: ${{ vars.HF_KEEPALIVE_URLS }}
  MANUAL_URLS: ${{ inputs.urls }}

jobs:
  visit-spaces:
    name: Visit configured Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Visit each configured Space
        shell: bash
        run: |
          set -uo pipefail

          urls="${MANUAL_URLS:-${REPOSITORY_URLS:-$DEFAULT_URLS}}"
          failures=0

          while IFS= read -r raw_url; do
            url="$(echo "$raw_url" | xargs)"
            [ -z "$url" ] && continue

            echo "::group::Visiting $url"
            response_file="$(mktemp)"

            if status_code="$(curl \
              --location \
              --silent \
              --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --user-agent 'Mozilla/5.0 (compatible; HF-Space-Keepalive/1.0)' \
              "$url")"; then
              response_bytes="$(wc -c < "$response_file" | tr -d ' ')"
              echo "HTTP status: $status_code; body bytes: $response_bytes"

              if [[ "$status_code" =~ ^[23][0-9][0-9]$ ]]; then
                echo "Visit completed."
              else
                echo "::error::Unexpected HTTP status $status_code for $url"
                failures=$((failures + 1))
              fi
            else
              echo "::error::Request failed for $url"
              failures=$((failures + 1))
            fi

            rm -f "$response_file"
            echo "::endgroup::"
          done < <(printf '%s\n' "$urls" | tr ',' '\n')

          if [ "$failures" -gt 0 ]; then
            echo "::error::$failures Space visit(s) failed"
            exit 1
          fi
